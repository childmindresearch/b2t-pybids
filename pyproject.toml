[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bids2table-compat"
version = "0.1.0"
description = "PyBIDS compatibility layer for bids2table"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "NiPreps Developers", email = "nipreps@gmail.com"}
]
dependencies = [
    "bids2table>=0.1.0",
    "pandas>=2.0.0",
    "polars>=1.40.1",
    "pyarrow>=10.0.0",
    "pybids>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bids2table_compat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "marimo>=0.9.0",
    "tabulate>=0.9.0",
]
